<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>3 BHK Flat Tour - A-Frame</title>
    <meta name="description" content="3 BHK Flat Architectural Walkthrough for Meta Quest 3S">
    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- A-Frame Environment Component -->
    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
    
    <script>
      // Component to handle teleports/movement with Meta Quest 3S controllers
      AFRAME.registerComponent('quest-controls-handler', {
        init: function () {
          var el = this.el;
          
          // Primary trigger or grip actions for interaction
          el.addEventListener('triggerdown', function (evt) {
            // Add custom raycast or interaction logic here
          });
          
          // Thumbstick movement navigation support
          el.addEventListener('thumbstickmoved', function (evt) {
            // Handled via movement-controls / oculus-touch-controls
          });
        }
      });
    </script>
  </head>
  <body>
    <a-scene environment="preset: apartment; skyType: atmosphere; lighting: low;" renderer="antialias: true;">
      
      <!-- Asset Management -->
      <a-assets>
        <!-- Wall, Floor, and Door Material Mixins -->
        <a-mixin id="wall-mat" material="color: #F5F5F0; roughness: 0.8;"></a-mixin>
        <a-mixin id="floor-mat" material="color: #8B5A2B; roughness: 0.4; metalness: 0.1;"></a-mixin>
        <a-mixin id="ceiling-mat" material="color: #FFFFFF; roughness: 0.9;"></a-mixin>
        <a-mixin id="door-mat" material="color: #3D2314; roughness: 0.5;"></a-mixin>
        <a-mixin id="furniture-mat" material="color: #2C3E50; roughness: 0.6;"></a-mixin>
      </a-assets>

      <!-- Player Rig & Meta Quest 3S Controller Setup -->
      <a-entity id="rig" position="0 0 8">
        <a-camera id="camera" position="0 1.6 0" look-controls="pointerLockEnabled: false"></a-camera>
        
        <!-- Quest 3S Left Controller -->
        <a-entity id="leftHand" 
                  oculus-touch-controls="hand: left; model: true;" 
                  laser-controls="hand: left" 
                  raycaster="objects: .clickable; far: 10" 
                  quest-controls-handler>
        </a-entity>
        
        <!-- Quest 3S Right Controller -->
        <a-entity id="rightHand" 
                  oculus-touch-controls="hand: right; model: true;" 
                  laser-controls="hand: right" 
                  raycaster="objects: .clickable; far: 10" 
                  quest-controls-handler>
        </a-entity>
      </a-entity>

      <!-- Ambient Lighting -->
      <a-ambient-light color="#FFFFFF" intensity="0.6"></a-ambient-light>
      <a-directional-light color="#FFF" intensity="0.4" position="-1 4 2"></a-directional-light>

      <!-- 3 BHK FLAT STRUCTURE -->

      <!-- MAIN FLOOR PLAN (16m x 12m) -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="16" height="12" mixin="floor-mat"></a-plane>
      <!-- CEILING -->
      <a-plane position="0 3 0" rotation="90 0 0" width="16" height="12" mixin="ceiling-mat"></a-plane>

      <!-- EXTERIOR BOUNDARY WALLS -->
      <a-box position="0 1.5 -6" width="16" height="3" depth="0.2" mixin="wall-mat"></a-box> <!-- North -->
      <a-box position="0 1.5 6" width="16" height="3" depth="0.2" mixin="wall-mat"></a-box>  <!-- South -->
      <a-box position="-8 1.5 0" width="0.2" height="3" depth="12" mixin="wall-mat"></a-box> <!-- West -->
      <a-box position="8 1.5 0" width="0.2" height="3" depth="12" mixin="wall-mat"></a-box>  <!-- East -->

      <!-- INTERIOR PARTITION WALLS -->
      <!-- Foyer / Hall Separator -->
      <a-box position="-2 1.5 2" width="0.2" height="3" depth="8" mixin="wall-mat"></a-box>
      <!-- Bedroom 1 Divider -->
      <a-box position="3 1.5 -2" width="10" height="3" depth="0.2" mixin="wall-mat"></a-box>
      <!-- Bedroom 2 & 3 Divider -->
      <a-box position="3 1.5 2" width="10" height="3" depth="0.2" mixin="wall-mat"></a-box>

      <!-- ROOM LABELS & FURNISHING INDICATORS -->
      
      <!-- LIVING ROOM / HALL -->
      <a-text value="Living Room" position="-5 2.5 0" rotation="0 90 0" align="center" color="#333" width="6"></a-text>
      <!-- Sofa Placeholder -->
      <a-box position="-6 0.4 0" width="1.2" height="0.8" depth="2.5" mixin="furniture-mat"></a-box>
      <a-box position="-4.5 0.3 -2.5" width="2" height="0.6" depth="0.4" color="#111"></a-box> <!-- TV Unit -->

      <!-- BEDROOM 1 (Master Bedroom - North East) -->
      <a-text value="Master Bedroom (BHK 1)" position="3 2.5 -4" rotation="0 0 0" align="center" color="#333" width="5"></a-text>
      <a-box position="3 0.5 -4.5" width="2" height="0.8" depth="2" color="#4A6984"></a-box> <!-- Bed -->

      <!-- BEDROOM 2 (Kids/Guest Bedroom - Center East) -->
      <a-text value="Bedroom 2 (BHK 2)" position="3 2.5 0" rotation="0 0 0" align="center" color="#333" width="5"></a-text>
      <a-box position="3 0.5 0" width="2" height="0.8" depth="1.8" color="#6C5CE7"></a-box> <!-- Bed -->

      <!-- BEDROOM 3 (Guest Bedroom - South East) -->
      <a-text value="Bedroom 3 (BHK 3)" position="3 2.5 4" rotation="0 0 0" align="center" color="#333" width="5"></a-text>
      <a-box position="3 0.5 4" width="2" height="0.8" depth="1.8" color="#00B894"></a-box> <!-- Bed -->

      <!-- KITCHEN (North West) -->
      <a-text value="Kitchen" position="-5 2.5 -4" rotation="0 90 0" align="center" color="#333" width="5"></a-text>
      <a-box position="-7 0.4 -4" width="1" height="0.8" depth="3" color="#D63031"></a-box> <!-- Counter -->

      <!-- TELEPORT / WAYPOINT MARKERS FOR QUEST 3S NAVIGATION -->
      <a-cylinder class="clickable" position="-5 0.05 4" radius="0.4" height="0.02" color="#00FF88" opacity="0.8"></a-cylinder>
      <a-cylinder class="clickable" position="-5 0.05 0" radius="0.4" height="0.02" color="#00FF88" opacity="0.8"></a-cylinder>
      <a-cylinder class="clickable" position="-5 0.05 -4" radius="0.4" height="0.02" color="#00FF88" opacity="0.8"></a-cylinder>
      <a-cylinder class="clickable" position="3 0.05 -4" radius="0.4" height="0.02" color="#00FF88" opacity="0.8"></a-cylinder>
      <a-cylinder class="clickable" position="3 0.05 0" radius="0.4" height="0.02" color="#00FF88" opacity="0.8"></a-cylinder>
      <a-cylinder class="clickable" position="3 0.05 4" radius="0.4" height="0.02" color="#00FF88" opacity="0.8"></a-cylinder>

    </a-scene>
  </body>
</html>
